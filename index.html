<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/nexo-pwa/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="NEXO IA: especialistas para estudar, planejar e criar no dia a dia.">
  <meta name="theme-color" content="#212121">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXO IA">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>NEXO IA</title>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #111318;
      color: #f4f6ff;
    }

    .nexo-install-card {
      box-sizing: border-box;
      position: fixed;
      z-index: 10000;
      top: calc(env(safe-area-inset-top) + 68px);
      right: max(16px, env(safe-area-inset-right));
      left: max(16px, env(safe-area-inset-left));
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto 36px;
      align-items: center;
      gap: 14px;
      width: min(100% - 32px, 520px);
      margin-inline: auto;
      padding: 14px;
      border: 1px solid rgba(111, 151, 255, .42);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(38, 45, 63, .98), rgba(25, 29, 40, .98));
      box-shadow: 0 18px 56px rgba(0, 0, 0, .48), 0 0 0 1px rgba(255, 255, 255, .04) inset;
      color: #f4f6ff;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: nexo-install-enter 260ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .nexo-install-card[hidden] {
      display: none;
    }

    .nexo-install-shortcut {
      box-sizing: border-box;
      position: fixed;
      z-index: 9999;
      top: calc(env(safe-area-inset-top) + 68px);
      right: max(16px, env(safe-area-inset-right));
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(111, 151, 255, .58);
      border-radius: 15px;
      background: linear-gradient(145deg, #2a3348, #1b2030);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .34);
      color: #9bc5ff;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .nexo-install-shortcut svg {
      width: 20px;
      height: 20px;
    }

    .nexo-install-shortcut:hover {
      transform: translateY(-2px);
      border-color: #9bc5ff;
      background: linear-gradient(145deg, #34425d, #20283a);
    }

    .nexo-install-shortcut:focus-visible {
      outline: 3px solid #9bc5ff;
      outline-offset: 3px;
    }

    .nexo-install-shortcut[hidden] {
      display: none;
    }

    .nexo-install-icon {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 15px;
      background: #111318;
      object-fit: contain;
    }

    .nexo-install-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .nexo-install-copy strong {
      font-size: 15px;
      font-weight: 750;
    }

    .nexo-install-copy span {
      color: #c4cad8;
      font-size: 13px;
    }

    .nexo-install-button {
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #73aaff, #a38cff);
      color: #111318;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .nexo-install-button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .nexo-install-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .08);
      color: #e1e6f1;
      font: 22px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      .nexo-install-shortcut {
        top: calc(env(safe-area-inset-top) + 40px);
        right: max(12px, env(safe-area-inset-right));
        width: 32px;
        height: 32px;
        border-radius: 11px;
        box-shadow: 0 5px 16px rgba(0, 0, 0, .26);
      }

      .nexo-install-shortcut svg {
        width: 17px;
        height: 17px;
      }

      .nexo-install-card {
        grid-template-columns: 36px minmax(0, 1fr) auto 32px;
        gap: 8px;
        padding: 10px;
        border-radius: 19px;
      }

      .nexo-install-icon {
        width: 36px;
        height: 36px;
      }

      .nexo-install-copy strong {
        font-size: 12px;
      }

      .nexo-install-copy span {
        font-size: 11px;
      }

      .nexo-install-button {
        min-height: 36px;
        padding-inline: 10px;
        font-size: 12px;
      }

      .nexo-install-close {
        width: 32px;
        height: 32px;
        justify-self: end;
      }
    }

    @keyframes nexo-install-enter {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nexo-install-card { animation: none; }
      .nexo-install-shortcut { transition: none; }
    }
  </style>
</head>
<body>
  <aside id="nexo-install-card" class="nexo-install-card" role="status" aria-live="polite" hidden>
    <img class="nexo-install-icon" src="icons/Icon-192.png" alt="">
    <div class="nexo-install-copy">
      <strong>Tenha o NEXO sempre à mão</strong>
      <span id="nexo-install-copy-text">Instale para abrir em tela cheia no celular ou no computador.</span>
    </div>
    <button id="nexo-install-button" class="nexo-install-button" type="button">Instalar</button>
    <button id="nexo-install-close" class="nexo-install-close" type="button" aria-label="Dispensar aviso de instalação">×</button>
  </aside>
  <button id="nexo-install-shortcut" class="nexo-install-shortcut" type="button" aria-label="Instalar o NEXO" title="Instalar o NEXO" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <script>
    (() => {
      const card = document.getElementById('nexo-install-card');
      const shortcut = document.getElementById('nexo-install-shortcut');
      const installButton = document.getElementById('nexo-install-button');
      const closeButton = document.getElementById('nexo-install-close');
      const copyText = document.getElementById('nexo-install-copy-text');
      const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      let installPrompt = null;

      if (isInstalled()) return;

      shortcut.hidden = false;

      const openCard = () => {
        if (installPrompt) {
          installButton.hidden = false;
          copyText.textContent = 'Instale para abrir em tela cheia no celular ou no computador.';
        } else {
          installButton.hidden = true;
          copyText.textContent = isIos
            ? 'No Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início”.'
            : 'Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.';
        }
        card.hidden = false;
        shortcut.hidden = true;
      };

      shortcut.addEventListener('click', openCard);

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        installPrompt = event;
        if (sessionStorage.getItem('nexo-install-dismissed') !== '1') openCard();
      });

      installButton.addEventListener('click', async () => {
        if (!installPrompt) {
          openCard();
          return;
        }
        installButton.disabled = true;
        const currentPrompt = installPrompt;
        installPrompt = null;
        try {
          await currentPrompt.prompt();
          const choice = await currentPrompt.userChoice;
          if (choice?.outcome === 'accepted') {
            card.hidden = true;
            shortcut.hidden = true;
          } else {
            card.hidden = true;
            shortcut.hidden = false;
          }
        } catch (_) {
          copyText.textContent = 'Abra o menu do navegador e escolha “Instalar app”.';
        } finally {
          installButton.disabled = false;
        }
      });

      closeButton.addEventListener('click', () => {
        sessionStorage.setItem('nexo-install-dismissed', '1');
        card.hidden = true;
        shortcut.hidden = false;
      });

      window.addEventListener('appinstalled', () => {
        card.hidden = true;
        shortcut.hidden = true;
        sessionStorage.removeItem('nexo-install-dismissed');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
