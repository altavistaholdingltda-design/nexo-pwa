<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/nexo-pwa/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="NEXO IA: especialistas para estudar, planejar e criar no dia a dia.">
  <meta name="theme-color" content="#212121">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXO IA">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>NEXO IA</title>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: #212121;
      color: #f4f6ff;
    }

    .nexo-install-card {
      box-sizing: border-box;
      position: fixed;
      z-index: 10000;
      top: calc(env(safe-area-inset-top) + 68px);
      right: max(16px, env(safe-area-inset-right));
      left: max(16px, env(safe-area-inset-left));
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto 36px;
      align-items: center;
      gap: 14px;
      width: min(100% - 32px, 520px);
      margin-inline: auto;
      padding: 14px;
      border: 1px solid rgba(111, 151, 255, .42);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(38, 45, 63, .98), rgba(25, 29, 40, .98));
      box-shadow: 0 18px 56px rgba(0, 0, 0, .48), 0 0 0 1px rgba(255, 255, 255, .04) inset;
      color: #f4f6ff;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: nexo-install-enter 260ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .nexo-install-card[hidden] {
      display: none;
    }

    .nexo-install-icon {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 15px;
      background: #111318;
      object-fit: contain;
    }

    .nexo-install-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .nexo-install-copy strong {
      font-size: 15px;
      font-weight: 750;
    }

    .nexo-install-copy span {
      color: #c4cad8;
      font-size: 13px;
    }

    .nexo-install-button {
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #73aaff, #a38cff);
      color: #111318;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .nexo-install-button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .nexo-install-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .08);
      color: #e1e6f1;
      font: 22px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      .nexo-install-card {
        grid-template-columns: 36px minmax(0, 1fr) auto 32px;
        gap: 8px;
        padding: 10px;
        border-radius: 19px;
      }

      .nexo-install-icon {
        width: 36px;
        height: 36px;
      }

      .nexo-install-copy strong {
        font-size: 12px;
      }

      .nexo-install-copy span {
        font-size: 11px;
      }

      .nexo-install-button {
        min-height: 36px;
        padding-inline: 10px;
        font-size: 12px;
      }

      .nexo-install-close {
        width: 32px;
        height: 32px;
        justify-self: end;
      }
    }

    @keyframes nexo-install-enter {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nexo-install-card { animation: none; }
    }
  </style>
</head>
<body>
  <aside id="nexo-install-card" class="nexo-install-card" role="status" aria-live="polite" hidden>
    <img class="nexo-install-icon" src="icons/Icon-192.png" alt="">
    <div class="nexo-install-copy">
      <strong>Tenha o NEXO sempre à mão</strong>
      <span id="nexo-install-copy-text">Instale para abrir em tela cheia no celular ou no computador.</span>
    </div>
    <button id="nexo-install-button" class="nexo-install-button" type="button">Instalar</button>
    <button id="nexo-install-close" class="nexo-install-close" type="button" aria-label="Dispensar aviso de instalação">×</button>
  </aside>
  <script>
    (() => {
      const card = document.getElementById('nexo-install-card');
      const installButton = document.getElementById('nexo-install-button');
      const closeButton = document.getElementById('nexo-install-close');
      const copyText = document.getElementById('nexo-install-copy-text');
      const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      let installPrompt = null;

      const openCard = () => {
        if (isInstalled()) {
          installButton.hidden = true;
          copyText.textContent = 'O NEXO já está instalado neste dispositivo.';
        } else if (installPrompt) {
          installButton.hidden = false;
          copyText.textContent = 'Instale para abrir em tela cheia no celular ou no computador.';
        } else {
          installButton.hidden = true;
          copyText.textContent = isIos
            ? 'No Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início”.'
            : 'Abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.';
        }
        card.hidden = false;
      };

      window.nexoShowInstallCard = openCard;
      if (isInstalled()) return;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        installPrompt = event;
        if (sessionStorage.getItem('nexo-install-dismissed') !== '1') openCard();
      });

      installButton.addEventListener('click', async () => {
        if (!installPrompt) {
          openCard();
          return;
        }
        installButton.disabled = true;
        const currentPrompt = installPrompt;
        installPrompt = null;
        try {
          await currentPrompt.prompt();
          const choice = await currentPrompt.userChoice;
          if (choice?.outcome === 'accepted') {
            card.hidden = true;
          } else {
            card.hidden = true;
          }
        } catch (_) {
          copyText.textContent = 'Abra o menu do navegador e escolha “Instalar app”.';
        } finally {
          installButton.disabled = false;
        }
      });

      closeButton.addEventListener('click', () => {
        sessionStorage.setItem('nexo-install-dismissed', '1');
        card.hidden = true;
      });

      window.addEventListener('appinstalled', () => {
        card.hidden = true;
        sessionStorage.removeItem('nexo-install-dismissed');
      });
    })();
  </script>
  <script>
    window.nexoOpenPdfPreview = function (bytes) {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      const overlay = document.createElement('div');
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', 'Visualização do PDF');
      Object.assign(overlay.style, {
        position: 'fixed', inset: '0', zIndex: '2147483647',
        display: 'flex', flexDirection: 'column', background: '#202124',
      });
      const bar = document.createElement('div');
      Object.assign(bar.style, {
        display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 16px',
        color: '#fff', font: '600 15px system-ui, sans-serif',
      });
      const title = document.createElement('span');
      title.textContent = 'Prévia do PDF';
      title.style.flex = '1';
      const download = document.createElement('a');
      download.href = url;
      download.download = 'nexo-material.pdf';
      download.textContent = 'Baixar';
      Object.assign(download.style, { color: '#79b2ff', textDecoration: 'none' });
      const close = document.createElement('button');
      close.type = 'button';
      close.textContent = 'Fechar';
      Object.assign(close.style, {
        background: '#34373b', color: '#fff', border: '0',
        borderRadius: '8px', padding: '9px 13px', cursor: 'pointer',
      });
      let onPreviewResize;
      close.addEventListener('click', () => {
        if (onPreviewResize) window.removeEventListener('resize', onPreviewResize);
        overlay.remove();
        URL.revokeObjectURL(url);
      });
      bar.append(title, download, close);
      const viewer = document.createElement('div');
      viewer.setAttribute('aria-label', 'Páginas do PDF');
      Object.assign(viewer.style, {
        flex: '1', minHeight: '0', overflow: 'auto', padding: '12px',
        display: 'flex', justifyContent: 'center', alignItems: 'flex-start',
      });
      const status = document.createElement('span');
      status.textContent = 'Preparando visualização…';
      status.style.color = '#fff';
      viewer.append(status);
      const footer = document.createElement('div');
      Object.assign(footer.style, {
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        gap: '18px', padding: '10px', color: '#fff', font: '14px system-ui, sans-serif',
      });
      const prev = document.createElement('button');
      prev.textContent = 'Anterior';
      const count = document.createElement('span');
      const next = document.createElement('button');
      next.textContent = 'Próxima';
      for (const button of [prev, next]) {
        Object.assign(button.style, {
          background: '#34373b', color: '#fff', border: '0',
          borderRadius: '8px', padding: '9px 13px', cursor: 'pointer',
        });
      }
      footer.append(prev, count, next);
      const file = new File([bytes], 'nexo-material.pdf', { type: 'application/pdf' });
      if (navigator.canShare?.({ files: [file] })) {
        const share = document.createElement('button');
        share.textContent = 'Compartilhar';
        Object.assign(share.style, {
          background: '#2878e8', color: '#fff', border: '0',
          borderRadius: '8px', padding: '9px 13px', cursor: 'pointer',
        });
        share.addEventListener('click', async () => {
          try { await navigator.share({ files: [file], title: 'Material NEXO' }); }
          catch (_) { /* Cancelar a folha de compartilhamento mantém a prévia aberta. */ }
        });
        footer.append(share);
      }
      overlay.append(bar, viewer, footer);
      document.body.append(overlay);
      (async () => {
        try {
          const base = document.baseURI;
          const pdfjs = await import(new URL('pdfjs/pdf.min.mjs', base).href);
          pdfjs.GlobalWorkerOptions.workerSrc = new URL('pdfjs/pdf.worker.min.mjs', base).href;
          const pdf = await pdfjs.getDocument({ data: new Uint8Array(bytes) }).promise;
          let current = 1;
          let renderVersion = 0;
          const renderPage = async () => {
            const version = ++renderVersion;
            viewer.replaceChildren();
            const page = await pdf.getPage(current);
            const natural = page.getViewport({ scale: 1 });
            const scale = Math.min(1.6, Math.max(0.5, (viewer.clientWidth - 24) / natural.width));
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.ceil(viewport.width * pixelRatio);
            canvas.height = Math.ceil(viewport.height * pixelRatio);
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;
            canvas.style.maxWidth = '100%';
            canvas.style.boxShadow = '0 8px 30px #0008';
            const context = canvas.getContext('2d');
            const transform = pixelRatio === 1 ? null : [pixelRatio, 0, 0, pixelRatio, 0, 0];
            await page.render({ canvasContext: context, viewport, transform }).promise;
            if (version !== renderVersion || !overlay.isConnected) return;
            viewer.append(canvas);
            viewer.scrollTop = 0;
            count.textContent = `${current} / ${pdf.numPages}`;
            prev.disabled = current === 1;
            next.disabled = current === pdf.numPages;
          };
          prev.addEventListener('click', () => { if (current > 1) { current--; renderPage(); } });
          next.addEventListener('click', () => { if (current < pdf.numPages) { current++; renderPage(); } });
          if (!overlay.isConnected) return;
          let resizeTimer;
          onPreviewResize = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderPage, 150);
          };
          window.addEventListener('resize', onPreviewResize);
          await renderPage();
        } catch (error) {
          status.textContent = 'Não foi possível mostrar a prévia neste navegador. Use Baixar.';
          viewer.replaceChildren(status);
        }
      })();
      return true;
    };
  </script>

</body>
</html>
